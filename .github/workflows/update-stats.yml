name: Update Roblox stats

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:
  push:
    paths:
      - "data/games.json"
      - "data/profile.json"
      - "scripts/update-stats.js"
      - ".github/workflows/update-stats.yml"

permissions:
  contents: write

jobs:
  update-stats:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Fetch Roblox stats and avatar
        run: node scripts/update-stats.js

      - name: Commit changes if any
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/stats.json assets/profile.png
          if git diff --cached --quiet; then
            echo "No stats or avatar changes"
            exit 0
          fi
          git commit -m "chore: refresh Roblox stats and avatar"
          git push
